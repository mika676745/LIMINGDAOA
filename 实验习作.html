<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>实验习作</title>
		<link href="css/目录设置.css" rel="stylesheet" type="text/css"/>
		<style type="text/css">
			
			.syxztupian{
				width: 1750;
				height: 1000px;
				background-color: #F4FDF4;
				display: flex;
				flex-wrap: wrap;/*换行*/
				align-content: flex-start;
				padding-left:50px;
				padding-right: 50px;
				margin-bottom: 100px;
			}
			.yigetu{
				
				margin: 20px;
				
			}
			.zezao{
				width: 300px;
				height: 400px;
				margin: 20px;
				background-image: url("img/门神.png");
				background-repeat: no-repeat;
				background-size: cover;
				overflow: hidden;
				position: relative;
			}
			.zezao hgroup{
				width: 300px;
				height: 400px;
				background-color: rgba(0,0,0,0.5);
				position: absolute;
				left: 0px;
				top: -400px;
			}
			.zezao:hover hgroup{
				position: absolute;/*定位*/
				left: 0px;
				top: 0px;
				transition-property: all;
				transition-duration: 2s;
				transition-timing-function: ease-in-out;
			}
			.zezao hgroup h2:nth-child(1){
				text-align: center;
				color: white;
				font-size: 70px;
				font-family: "黑体";
			}
			.zezao hgroup h2:nth-child(2){
				text-align: center;
				color: white;
				font-size: 50px;
				font-family: "黑体";
			}
			nav{
				width: 100%;
				height: 50px;
				background-color: #88B788;
				text-align: center;
				margin-top: 20px;
				margin-bottom: 70px;
			}
			li{
				list-style-type: none;
				height: 100px;
				padding-left: 80px;/*内边距：左边的高度(字体之间的距离)*/
				padding-top: -10px;/*内边距：上方的高度（指字体）*/
				font-size: 35px;/*字体的大小*/
				display: inline-block;/*横向排列*/
			}
			a{
				text-decoration: none;
			}
			a:link{
				color: #000000;/*未访问超链接的*/
				
			}
			a:visited{
				color: ;/*访问后超链接的*/
				text-decoration: #20B2AA;
			}
			a:hover{
				color: red;/*鼠标悬浮时*/
			}
			a:active{
				color: #008B8B;/*鼠标左键不松开时的颜色*/
			}
			footer{
				text-align: center;/*单元格框的行内内容水平对齐*/
				padding: 20px;/*内边距*/
				background-color: rgba(255,255,255,0.7);
				margin-top: auto;/*外边距的上方：取一个合适的数值*/
				font-size: 0.9rem;/*字体大小*/
				color: #555;
			}
		</style>
	</head>
	<body>

				</hgroup>
			</div>
			<div class="yigetu">
				<img src="img/茶韵.png" alt="茶韵" title="茶韵" width="300"/>
			</div>
